# The hub: one droplet, one reverse proxy, one Postgres, one service per game.
# Lives at /opt/hub on the droplet. This file is the master copy: keep it the same as the server's.
# Start or update everything with:
#   docker compose up -d
# Deploys only ever touch their own service:  docker compose up -d <service>
#
# To add another game: add a service below (with the logging, mem_limit and cpus lines),
# a block to the Caddyfile, and (if it needs a database) run ./add-database.sh <name>.
# Never add `ports:` to a game: Docker-published ports skip the firewall. Caddy is the only way in.
#
# Also on the droplet, outside this file: the Oh Ship station (container oh-ship-station,
# 7777/udp, capped at 512 MB and 1 CPU), started by the oh-ship repo's tools/station/deploy-station.sh.

# Every service keeps at most 3 x 10 MB of logs, so logs can never fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging
    mem_limit: 256m

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      HORMIGAS_DB_PASSWORD: ${HORMIGAS_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    mem_limit: 512m
    # No ports published: only the other containers can reach the database.

  hormigas:
    image: ghcr.io/marcialpimentel/hormigas:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hormigas:${HORMIGAS_DB_PASSWORD}@db:5432/hormigas
      WORLD_NAME: ${HORMIGAS_WORLD_NAME:-The Backyard}
      # optional: secret for the private feedback page (docs/DEPLOY.md)
      FEEDBACK_KEY: ${HORMIGAS_FEEDBACK_KEY:-}
      # Production defaults already apply: world speed x1, secure cookies,
      # trusted proxy headers (Caddy sits in front).
    depends_on:
      db:
        condition: service_healthy
    # Give in-flight game events time to finish on each deploy (the server handles SIGTERM).
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *logging
    mem_limit: 512m
    cpus: 0.75

  # Guildie realtime rooms (repo: guildie, realtime/). The game page itself is on SiteGround.
  guildie-realtime:
    image: ghcr.io/marcialpimentel/guildie-realtime:latest
    restart: unless-stopped
    environment:
      REALTIME_SECRET: ${GUILDIE_REALTIME_SECRET}
      ALLOWED_ORIGINS: https://marz.gg,https://www.marz.gg
      CAPACITY: "30"
    # Players reconnect by themselves after a restart; a short grace period is enough.
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
    mem_limit: 256m
    cpus: 0.5

  # Last Hand (repo: last-hand, deploy/compose-service.yml).
  last-hand:
    image: ghcr.io/marcialpimentel/last-hand:latest
    restart: unless-stopped
    environment:
      PORT: "8790"
      MAX_ROOMS: "200"
    # A restart ends any match in progress; players land back on the home screen.
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
    mem_limit: 256m
    cpus: 0.5

  # Sunk Cost (repo: sunk-cost, deploy/hub/add-to-hub.sh). Serves the page and the game's WebSocket
  # on port 8080 inside Docker; Caddy is the only way in. Dives live in memory, so a restart (each
  # deploy) ends any dive in progress; the grace period is short.
  sunk-cost:
    image: ghcr.io/marcialpimentel/sunk-cost:latest
    restart: unless-stopped
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
    mem_limit: 256m
    cpus: 0.5

  # SCRAM (repo: scram, deploy/hub/add-to-hub.sh). Serves the page and the game's WebSocket
  # on port 8791 inside Docker; Caddy is the only way in. Shifts live in memory, so a restart (each
  # deploy) ends any shift in progress; the grace period is short.
  scram:
    image: ghcr.io/marcialpimentel/scram:latest
    restart: unless-stopped
    environment:
      PORT: "8791"
      # Only SCRAM's own page (and marz.gg) may open a game connection.
      ALLOWED_ORIGINS: https://scram.marz.gg,https://marz.gg,https://www.marz.gg
      MAX_ROOMS: "50"
    stop_grace_period: 5s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8791/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  db_data:
