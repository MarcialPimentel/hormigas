# After CI passes on main, takes the Docker image CI already built and pushed to
# GitHub Container Registry (tagged with the commit SHA), marks it :latest, then
# has the droplet switch to it:
#   1. back up the hormigas database (the deploy stops if the backup fails)
#   2. keep the running build as :previous
#   3. start the new build
#   4. wait for it to report healthy; if it never does, switch back to :previous
#      and fail the run
#
# Run it by hand from the Actions tab (Deploy -> Run workflow) to redeploy main,
# or give it a commit from main to roll back to that build.
#
# Repo secrets needed (Settings -> Secrets and variables -> Actions):
#   DROPLET_HOST     the droplet's IP address
#   DROPLET_SSH_KEY  the private half of the deploy key (hormigas-deploy)

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: 'Roll back: a commit from main to deploy (short or full SHA). Leave empty to deploy the latest main.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  actions: read   # to check that CI passed on a commit picked by hand

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/marcialpimentel/hormigas

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Work out which build to deploy
        id: pick
        env:
          REQUESTED: ${{ inputs.commit }}
          DEFAULT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$DEFAULT_SHA
          if [ -n "$REQUESTED" ]; then
            sha=$(git rev-parse --verify --quiet "$REQUESTED^{commit}") || { echo "::error::No commit $REQUESTED in this repo."; exit 1; }
            git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$REQUESTED is not on main. Only builds from main can go live."; exit 1; }
            echo "Rolling back to $(git log -1 --format='%h %s' "$sha")"
          fi
          # Started by hand: CI also builds images for runs that then failed their tests, so make sure this one passed.
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            passed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --status success --json databaseId -q 'length')
            [ "$passed" -gt 0 ] || { echo "::error::CI never passed on ${sha:0:7}, so it can't go live."; exit 1; }
          fi
          docker manifest inspect "$IMAGE:$sha" > /dev/null 2>&1 || { echo "::error::There is no saved build for ${sha:0:7}. Pick a commit from main that CI built."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build here: CI already built and pushed this commit's image. Point :latest at it
      # (a registry-side retag, takes a second), including on rollbacks, so a manual
      # `docker compose pull` on the droplet always gets the build that is meant to be live.
      - name: Mark the build as latest
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:${{ steps.pick.outputs.sha }}"

      - name: Back up, switch builds, check health (rolls back on failure)
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ steps.pick.outputs.sha }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: IMAGE,DEPLOY_SHA
          command_timeout: 15m
          # The script is written to a file and run from there. Feeding it to bash on stdin let
          # `docker compose exec` read the rest of the script as its own input, so it silently stopped.
          script: |
            script=$(mktemp)
            cat > "$script" <<'REMOTE'
            cd /opt/hub
            short=${DEPLOY_SHA:0:7}

            echo "==> 1/4 Backing up the hormigas database"
            mkdir -p backups
            out="backups/predeploy-$(date -u +%Y%m%d-%H%M%S)-$short.sql.gz"
            trap 'rm -f "$out.part"' EXIT
            docker compose exec -T db pg_dump -U postgres --clean --if-exists --create hormigas < /dev/null | gzip > "$out.part"
            gzip -t "$out.part"
            [ "$(stat -c %s "$out.part")" -gt 1000 ] || { echo "::error::The backup came out empty, so nothing was deployed."; exit 1; }
            mv "$out.part" "$out"
            ls -1t backups/predeploy-*.sql.gz | tail -n +11 | xargs -r rm --   # keep the newest 10
            echo "Saved $out ($(du -h "$out" | cut -f1))"

            echo "==> 2/4 Keeping the running build as :previous"
            has_previous=0
            running=$(docker compose ps -q hormigas || true)
            if [ -n "$running" ]; then
              docker tag "$(docker inspect --format '{{.Image}}' "$running")" "$IMAGE:previous"
              has_previous=1
            fi

            echo "==> 3/4 Starting build $short"
            docker pull -q "$IMAGE:$DEPLOY_SHA"
            docker tag "$IMAGE:$DEPLOY_SHA" "$IMAGE:latest"
            docker image rm "$IMAGE:$DEPLOY_SHA" > /dev/null   # drop the extra tag so old builds don't pile up on disk
            docker compose up -d hormigas

            # Docker's health check (deploy/hub/docker-compose.yml) calls /api/health every 30 s,
            # which needs the server up and its database reachable.
            wait_healthy() {
              for _ in $(seq 1 36); do   # up to 3 minutes
                id=$(docker compose ps -q hormigas || true)
                status=missing
                [ -n "$id" ] && status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$id")
                [ "$status" = healthy ] && return 0
                sleep 5
              done
              echo "Last status: $status"
              return 1
            }

            echo "==> 4/4 Waiting for the game to report healthy"
            if wait_healthy; then
              echo "Build $short is live and healthy."
              docker image prune -f > /dev/null
              exit 0
            fi

            echo "::error::Build $short never became healthy. Its last log lines:"
            docker compose logs --no-color --tail 60 hormigas || true
            if [ "$has_previous" = 1 ]; then
              echo "==> Rolling back to the build that was running before"
              docker tag "$IMAGE:previous" "$IMAGE:latest"
              docker compose up -d hormigas
              if wait_healthy; then
                echo "::error::Rolled back: the previous build is running again. Build $short is NOT live."
              else
                echo "::error::The previous build is not healthy either. The game may be down: check the server."
              fi
            fi
            exit 1
            REMOTE
            rc=0
            bash -euo pipefail "$script" < /dev/null || rc=$?
            rm -f "$script"
            exit "$rc"

      - name: Check the live site
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS -m 10 https://hormigas.marz.gg/api/health; then echo; exit 0; fi
            sleep 5
          done
          echo "::error::https://hormigas.marz.gg/api/health is not answering ok, although the server reported healthy."
          exit 1
