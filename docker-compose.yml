# Local database for development. Start with: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hormigas
      POSTGRES_PASSWORD: hormigas
      POSTGRES_DB: hormigas
    ports:
      - "5432:5432"
    volumes:
      - hormigas-db:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  hormigas-db:
